{% extends 'base.html' %}
{% block content %}
<div class="container">
  <div class="card">
    <div class="profile-row">
<div style="width:78px;height:78px;border-radius:20px;overflow:hidden;border:1px solid rgba(255,255,255,.10);display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.03)">
        <img src="{{ current_user.profile_image or '' }}" alt="profile" style="width:100%;height:100%;object-fit:cover;display:block" onerror="this.style.display='none'" />
      </div>
      <div>
        <div style="font-size:20px; font-weight:900">{{ current_user.username }}</div>
        <div style="color:var(--muted); margin-top:4px">{{ current_user.email }}</div>
        <div style="color:var(--muted); margin-top:8px; font-size:13px">Joined: {{ current_user.created_at.strftime('%Y-%m-%d') }}</div>
      </div>
    </div>

    <div style="display:flex; gap:12px; flex-wrap:wrap; margin-top:14px">
      <div class="card" style="padding:12px; flex:1; background: rgba(255,255,255,.03)">
        <div style="font-size:12px; color:var(--muted)">Total saved images</div>
        <div id="total-images" style="font-size:26px; font-weight:900">{{ current_user.images|length }}</div>
      </div>
    </div>

    <div style="display:flex; gap:10px; margin-top:14px; flex-wrap:wrap">
      <a class="btn primary" href="/profile/edit">Edit profile</a>
      <button class="btn danger" onclick="handleLogout()">Logout</button>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/auth.js"></script>
{% endblock %}
