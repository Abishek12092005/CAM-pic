{% extends 'base.html' %}
{% block content %}
<div class="container">
    <div class="card auth-container" style="max-width: 400px; margin: 40px auto;">
        <h2 class="name">New <span class="accent">Password</span></h2>
        <form id="reset-form">
            <input type="hidden" id="token" value="{{ token }}">
            <input type="password" id="password" class="input" placeholder="Enter new password" required minlength="6">
            <button type="submit" class="btn primary" style="width: 100%; margin-top: 10px;">Change Password</button>
        </form>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('reset-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const token = document.getElementById('token').value;
    const password = document.getElementById('password').value;
    try {
        await apiFetch('/api/reset-password', {
            method: 'POST',
            body: { token, password }
        });
        toast('Password updated!', 'success');
        setTimeout(() => {
            window.location.href = '/login';
        }, 2000);
    } catch (err) {
        toast(err.message, 'error');
    }
});
</script>
{% endblock %}
