<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CAM pics</title>
  <link rel="manifest" href="/static/manifest.json" />
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <div class="topbar">
    <a class="brand" href="/">
      <svg width="34" height="34" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M18 18c2-4 6-6 10-6h8c4 0 8 2 10 6l2 4h5c3 0 5 2 5 5v24c0 3-2 5-5 5H11c-3 0-5-2-5-5V27c0-3 2-5 5-5h5l2-4Z" fill="rgba(255,213,0,.15)" stroke="rgba(255,213,0,.7)" stroke-width="3"/>
        <path d="M42 32c0 6-5 11-11 11S20 38 20 32s5-11 11-11 11 5 11 11Z" fill="rgba(255,213,0,.25)" stroke="rgba(255,213,0,.9)" stroke-width="3"/>
        <path d="M49 21h-8" stroke="rgba(255,213,0,.9)" stroke-width="3" stroke-linecap="round"/>
      </svg>
      <div class="name">CAM <span class="accent">pics</span></div>
    </a>
    <div style="display:flex; gap:10px; align-items:center">
      {% if current_user.is_authenticated %}
        <a class="btn ghost" href="/profile">Profile</a>
      {% else %}
        <a class="btn ghost" href="/login">Login</a>
      {% endif %}
    </div>
  </div>

  <div class="page">
    {% block content %}{% endblock %}
  </div>

  <nav class="bottom-nav">
    <a class="nav-item {% if request.path.startswith('/camera') %}active{% endif %}" href="/camera">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
        <circle cx="12" cy="13" r="4"></circle>
      </svg>
      <span>Camera</span>
      <div class="dot"></div>
    </a>

    <a class="nav-item {% if request.path.startswith('/memories') %}active{% endif %}" href="/memories">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
        <line x1="3" y1="9" x2="21" y2="9"></line>
        <line x1="9" y1="21" x2="9" y2="9"></line>
      </svg>
      <span>Memories</span>
      <div class="dot"></div>
    </a>

    {% if current_user.is_authenticated %}
      <a class="nav-item {% if request.path.startswith('/profile') %}active{% endif %}" href="/profile">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
        <span>Profile</span>
        <div class="dot"></div>
      </a>
    {% endif %}
  </nav>

  <script src="/static/js/api.js"></script>
  {% block scripts %}{% endblock %}

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/static/sw.js').catch(()=>{});
    }
  </script>
</body>
</html>
