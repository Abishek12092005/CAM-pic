{% extends 'base.html' %}
{% block content %}
<div class="container">
    <div class="card auth-container" style="max-width: 400px; margin: 40px auto;">
        <h2 class="name">Reset <span class="accent">Password</span></h2>
        <p style="font-size: 14px; color: var(--muted); margin-bottom: 20px;">Enter your email to get a reset link.</p>
        <form id="forgot-form">
            <input type="email" id="email" class="input" placeholder="Email" required>
            <button type="submit" class="btn primary" style="width: 100%; margin-top: 10px;">Send Link</button>
        </form>
        <div id="debug-area" style="margin-top:20px; display:none;">
            <p style="font-size:12px; color:var(--accent);">Testing Link (Normally sent via email):</p>
            <a id="test-link" href="#" style="font-size:12px; word-break: break-all;"></a>
        </div>
        <p style="margin-top: 20px; font-size: 14px;"><a href="/login" style="color: var(--muted);">Back to Login</a></p>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('forgot-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value;
    try {
        const res = await apiFetch('/api/forgot-password', {
            method: 'POST',
            body: { email }
        });
        toast('Reset link generated!', 'success');
        document.getElementById('debug-area').style.display = 'block';
        document.getElementById('test-link').href = res.debug_link;
        document.getElementById('test-link').textContent = res.debug_link;
    } catch (err) {
        toast(err.message, 'error');
    }
});
</script>
{% endblock %}
